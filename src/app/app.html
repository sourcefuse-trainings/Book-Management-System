<header class="bg-gradient-to-r from-blue-600 to-indigo-800 text-white py-5 shadow-md">
  <div class="max-w-7xl mx-auto text-center text-2xl font-bold tracking-wide">
    BMS - Book Management System
  </div>
</header>

<nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <a routerLink="/" class="flex items-center gap-2">
      <img src="assets/images/bmslogo.jpg" alt="logo" class="h-9 w-9 rounded shadow-sm" />
      <span class="font-bold text-xl text-gray-800">BMS</span>
    </a>

    <div class="flex items-center gap-8 text-sm font-semibold text-gray-600">
      <a
        routerLink="/"
        routerLinkActive="text-blue-600 border-b-2 border-blue-600"
        class="pb-1 hover:text-blue-600"
      >
        Dashboard
      </a>

      <a
        routerLink="/home"
        routerLinkActive="text-blue-600 border-b-2 border-blue-600"
        class="pb-1 hover:text-blue-600"
      >
        Home
      </a>

      <a
        routerLink="/add-book"
        routerLinkActive="text-blue-600 border-b-2 border-blue-600"
        class="pb-1 hover:text-blue-600"
      >
        Add Book
      </a>

      <a
        routerLink="/book-list"
        routerLinkActive="text-blue-600 border-b-2 border-blue-600"
        class="pb-1 hover:text-blue-600"
      >
        Book List
      </a>
    </div>
  </div>
</nav>

<div *ngIf="showDashboard" class="bg-gray-50 min-h-screen py-12">
  <div class="max-w-6xl mx-auto px-6">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-12">Dashboard</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
      <div class="bg-white p-8 rounded-2xl shadow border text-center">
        <h3 class="text-gray-500 text-xs font-bold uppercase">Total Books</h3>
        <p class="text-4xl font-black text-blue-600 mt-3">{{ totalBooks }}</p>
      </div>

      <div class="bg-white p-8 rounded-2xl shadow border text-center">
        <h3 class="text-gray-500 text-xs font-bold uppercase">Printed Books</h3>
        <p class="text-4xl font-black text-green-600 mt-3">{{ printedBooks }}</p>
      </div>

      <div class="bg-white p-8 rounded-2xl shadow border text-center">
        <h3 class="text-gray-500 text-xs font-bold uppercase">E-Books</h3>
        <p class="text-4xl font-black text-orange-500 mt-3">{{ ebookBooks }}</p>
      </div>
    </div>

    <div class="mt-12 flex justify-center gap-5">
      <button
        routerLink="/add-book"
        class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700"
      >
        Add Book
      </button>

      <button
        routerLink="/book-list"
        class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-900"
      >
        View Books
      </button>
    </div>
  </div>
</div>

<div *ngIf="!showDashboard" class="bg-gray-50 min-h-screen p-6">
  <router-outlet></router-outlet>
</div>
