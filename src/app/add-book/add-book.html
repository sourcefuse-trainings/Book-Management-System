<div class="max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-lg mt-10">

  <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">
    {{ isEditMode ? 'Edit Book' : 'Add Book' }}
  </h2>

  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="space-y-4">

    <input 
      formControlName="title" 
      placeholder="Title"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    />

    <input 
      formControlName="author" 
      placeholder="Author"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    />

    <input 
      formControlName="isbn" 
      placeholder="ISBN"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    />

    <input 
      type="date" 
      formControlName="publicationDate"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    />

    <select 
      formControlName="genre"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    >
      <option value="">Select Genre</option>
      <option>Fiction</option>
      <option>Non-Fiction</option>
      <option>Technology</option>
      <option>Science</option>
      <option>History</option>
    </select>

    <input 
      type="number" 
      formControlName="price" 
      placeholder="Price"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    />

    <select 
      formControlName="type"
      class="w-full border px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
    >
      <option value="">Select Type</option>
      <option>Printed Book</option>
      <option>E-Book</option>
    </select>

    <button 
      type="submit"
      class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
    >
      {{ isEditMode ? 'Update Book' : 'Add Book' }}
    </button>

  </form>
</div>
