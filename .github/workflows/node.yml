name: TypeScript CI

on:
  push:
    branches:
      - Solid-Principle

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Solid-Principle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build